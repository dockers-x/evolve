server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Game saves live in the browser; only assets need caching.
    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
